<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample builder page</title>
<style>
  /* A pretend site builder: header, padded sections, a centered max-width
     container. The embed code has to get past all of it. */
  body{margin:0;font-family:Helvetica,Arial,sans-serif;background:#fff;color:#333}
  .sb-header{display:flex;justify-content:space-between;padding:18px 28px;background:#222;color:#eee;font-size:14px}
  .sb-section{padding:48px 24px}
  .sb-container{max-width:760px;margin:0 auto;padding:0 20px}
  .sb-text{color:#777;font-size:14px;line-height:1.6}
  .sb-footer{padding:24px;text-align:center;background:#eee;font-size:13px;color:#777}
</style>
</head>
<body>
<div class="sb-header"><span>Your site header</span><span>Home &middot; About &middot; Shop</span></div>
<div class="sb-section"><div class="sb-container"><p class="sb-text">Text from the site builder above the code block.</p></div></div>
<div class="sb-section"><div class="sb-container" id="slot"></div></div>
<div class="sb-section"><div class="sb-container"><p class="sb-text">Text from the site builder below the code block.</p></div></div>
<div class="sb-footer">Your site footer</div>
<script>
  // Runs the embed code the generator passed in the address, the same way a builder would.
  (function () {
    // Only when the generator on this same site opened it.
    try { if (window.parent === window || window.parent.location.origin !== location.origin) return; } catch (e) { return; }
    var code = decodeURIComponent(location.hash.slice(1) || '');
    var tpl = document.createElement('template');
    tpl.innerHTML = code;
    var slot = document.getElementById('slot');
    var scripts = [];
    Array.prototype.forEach.call(tpl.content.childNodes, function (n) {
      if (n.nodeName === 'SCRIPT') scripts.push(n.textContent);
      else slot.appendChild(n.cloneNode(true));
    });
    scripts.forEach(function (text) {
      var s = document.createElement('script');
      s.textContent = text;
      document.body.appendChild(s);
    });
  })();
</script>
</body>
</html>
