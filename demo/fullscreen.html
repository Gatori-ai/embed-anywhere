<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full screen | Embed Anywhere demo</title>
<meta name="robots" content="noindex">
<style>
  /* Imitates a page builder: padding on every wrapper, a centered max-width
     column, a grid gap, and a transform that traps fixed elements. */
  body{margin:8px;font-family:Helvetica,Arial,sans-serif;color:#333;background:#fff}
  .site-header{display:flex;justify-content:space-between;padding:20px 32px;background:#222;color:#eee}
  .page-section{padding:60px 5vw;transform:translateZ(0)}
  .content-wrapper{max-width:960px;margin:0 auto;padding:0 24px}
  .block-grid{display:grid;grid-template-columns:1fr;column-gap:24px;padding:12px}
  .site-footer{padding:30px;background:#eee;text-align:center}
</style>
</head>
<body>
<header class="site-header"><span>Host site header</span><span>Home &middot; About</span></header>
<section class="page-section"><div class="content-wrapper"><p>Host page text above the code block.</p></div></section>
<section class="page-section"><div class="content-wrapper"><div class="block-grid"><div class="code-block">
<div id="ge-demo-layer" style="position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;margin:0;padding:0;z-index:2147483000;background:#f2ece0;">
<iframe id="ge-demo" src="https://embed-anywhere.netlify.app/starter/" title="Starter page" allow="clipboard-write; fullscreen; autoplay; encrypted-media; picture-in-picture; web-share" data-embed-mode="fullscreen" style="display:block;width:100%;height:100%;margin:0;padding:0;border:0;background:#f2ece0;"></iframe>
</div>
<style>
html,body{overflow:hidden!important;background:#f2ece0!important;}
#ge-demo-layer{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;margin:0!important;padding:0!important;transform:none!important;}
#ge-demo{width:100%!important;max-width:none!important;height:100%!important;margin:0!important;}
</style>
<script>
(function(){var l=document.getElementById('ge-demo-layer');if(!l)return;for(var p=l.parentElement;p&&p!==document.body;p=p.parentElement){var s=getComputedStyle(p);if(s.transform!=='none'||s.filter!=='none'||s.perspective!=='none'||s.contain.indexOf('paint')>-1||s.willChange.indexOf('transform')>-1){document.body.appendChild(l);break;}}})();
(function(){var f=document.getElementById('ge-demo');if(!f)return;try{var u=new URL(f.src),q=new URLSearchParams(location.search),c=false;q.forEach(function(v,k){if(!u.searchParams.has(k)){u.searchParams.set(k,v);c=true;}});if(location.hash&&location.hash!==u.hash){u.hash=location.hash;c=true;}if(c)f.src=u.href;}catch(e){}})();
</script>
</div></div></div></section>
<section class="page-section"><div class="content-wrapper"><p>Host page text below the code block.</p></div></section>
<footer class="site-footer">Host site footer</footer>
</body>
</html>
