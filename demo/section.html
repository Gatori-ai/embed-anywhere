<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fits its content | Embed Anywhere demo</title>
<meta name="robots" content="noindex">
<style>
  /* Imitates a page builder: padding on every wrapper, a centered max-width
     column, a grid gap, and a transform that traps fixed elements. */
  body{margin:8px;font-family:Helvetica,Arial,sans-serif;color:#333;background:#fff}
  .site-header{display:flex;justify-content:space-between;padding:20px 32px;background:#222;color:#eee}
  .page-section{padding:60px 5vw;transform:translateZ(0)}
  .content-wrapper{max-width:960px;margin:0 auto;padding:0 24px}
  .block-grid{display:grid;grid-template-columns:1fr;column-gap:24px;padding:12px}
  .site-footer{padding:30px;background:#eee;text-align:center}
</style>
</head>
<body>
<header class="site-header"><span>Host site header</span><span>Home &middot; About</span></header>
<section class="page-section"><div class="content-wrapper"><p>Host page text above the code block.</p></div></section>
<section class="page-section"><div class="content-wrapper"><div class="block-grid"><div class="code-block">
<div id="ge-demo-band" style="width:100vw;max-width:100vw;position:relative;left:50%;margin-left:-50vw;padding:0;line-height:0;background:#f2ece0;">
<iframe id="ge-demo" src="https://embed-anywhere.netlify.app/starter/" title="Starter page" allow="clipboard-write; fullscreen; autoplay; encrypted-media; picture-in-picture; web-share" data-embed-mode="auto" data-min="600" data-full-bleed="true" scrolling="no" style="display:block;width:100%;height:600px;margin:0;padding:0;border:0;overflow:hidden;background:#f2ece0;"></iframe>
</div>
<style>
body{overflow-x:clip;}#ge-demo-band{width:100vw!important;max-width:100vw!important;margin-left:-50vw!important;left:50%!important;}
#ge-demo{width:100%!important;max-width:none!important;margin:0!important;}
</style>
<script>
(function(){var f=document.getElementById('ge-demo');if(!f)return;var o=new URL(f.src).origin,n=0;window.addEventListener('message',function(e){if(e.source!==f.contentWindow||e.origin!==o||!e.data)return;var d=e.data;if(d.type==='gatori-embed:height'){var h=Math.ceil(Number(d.height));if(isFinite(h)&&h>0)f.style.setProperty('height',Math.max(600,Math.min(h,30000))+'px','important');}else if(d.type==='gatori-embed:load'&&n++>0){var r=f.getBoundingClientRect();if(r.top<0)window.scrollBy(0,r.top);}});})();
(function(){var b=document.getElementById('ge-demo-band');if(!b)return;var de=document.documentElement;function fit(){b.style.setProperty('left','0px','important');b.style.setProperty('margin-left','0px','important');var r=b.getBoundingClientRect();b.style.setProperty('width',de.clientWidth+'px','important');b.style.setProperty('max-width','none','important');b.style.setProperty('margin-left',(-r.left)+'px','important');}fit();window.addEventListener('resize',fit);window.addEventListener('load',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(de);})();
(function(){var f=document.getElementById('ge-demo');if(!f)return;try{var u=new URL(f.src),q=new URLSearchParams(location.search),c=false;q.forEach(function(v,k){if(!u.searchParams.has(k)){u.searchParams.set(k,v);c=true;}});if(location.hash&&location.hash!==u.hash){u.hash=location.hash;c=true;}if(c)f.src=u.href;}catch(e){}})();
</script>
</div></div></div></section>
<section class="page-section"><div class="content-wrapper"><p>Host page text below the code block.</p></div></section>
<footer class="site-footer">Host site footer</footer>
</body>
</html>
